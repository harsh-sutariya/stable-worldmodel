defaults:
  - launcher: local
  - solver: cem
  - objective: quasimetric
  - _self_

world:
  env_name: swm/OGBMaze-v0
  num_envs: ${eval.num_eval}
  max_episode_steps: 500
  loco_env_type: point
  maze_env_type: maze
  maze_type: umaze
  ob_type: pixels
  width: 64
  height: 64

seed: 42
policy: lewm_baseline_umaze/weights_epoch_0010.pt

plan_config:
  horizon: 5
  receding_horizon: 5
  action_block: 2
  history_len: 3

objective:
  ckpt_path: /Users/harsh/.stable_worldmodel/checkpoints/qm_baseline_umaze/qm_head.pt

dataset:
  stats: ${eval.dataset_name}
  keys_to_cache:
    - action
    - xy

eval:
  num_eval: 20
  goal_offset_steps: 30
  eval_budget: 100
  img_size: 64
  dataset_name: ogb_pointmaze_umaze.lance
  callables:
    - method: _set_state
      args:
        xy:
          value: xy
    - method: _set_goal_state
      args:
        goal_xy:
          value: goal_xy

compile: false
bf16: false

output:
  filename: umaze_qm_baseline_results.txt
